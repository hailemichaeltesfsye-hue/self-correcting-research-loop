[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-research-loop"
version = "0.1.0"
description = "A self-correcting research loop using LangGraph with HITL, checkpointing, and time travel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core",
    "langchain-openai",
    "langchain-google-genai",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "langchain-groq>=1.1.3",
    "pytest>=9.1.1",
    "grandalf>=0.8",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
